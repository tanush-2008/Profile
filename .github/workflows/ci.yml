name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify no source maps in dist
        run: |
          if find dist -name "*.map" | grep -q .; then
            echo "❌ Source maps found in dist/ — build is leaking source"
            find dist -name "*.map"
            exit 1
          fi
          echo "✅ No source maps in dist/"

      - name: Verify no sourceMappingURL in bundles
        run: |
          if grep -rl "sourceMappingURL" dist/assets/ 2>/dev/null | grep -q .; then
            echo "❌ sourceMappingURL found in bundle — inline source map leak"
            grep -rl "sourceMappingURL" dist/assets/
            exit 1
          fi
          echo "✅ No sourceMappingURL in bundles"

